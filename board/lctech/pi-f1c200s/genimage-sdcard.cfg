# SD-card image for the Lctech Pi F1C200s.
#   - offset 8 KiB : u-boot-sunxi-with-spl.bin (BROM loads SPL from here)
#   - partition 1  : FAT (zImage + dtb)   -> /dev/mmcblk0p1
#   - partition 2  : ext4 root filesystem -> /dev/mmcblk0p2
#   - partition 3  : ext4 logs            -> /dev/mmcblk0p3, mounted /var/log

image boot.vfat {
	vfat {
		files = {
			"zImage",
			"suniv-f1c200s-lctech-pi.dtb"
		}
	}

	size = 8M
}

# Logs get their own filesystem so they are never written into the rootfs.
# This is a head unit: it loses power the moment the ignition goes off, and a
# write-heavy log is the single most likely thing to corrupt the filesystem it
# lives on. Confining that risk to a partition nothing boots from means a torn
# log costs a fsck of p3, not an unbootable board.
#
# empty     - no source directory; genimage's ext4 handler omits mke2fs -d.
# temporary - the intermediate logs.ext4 is not kept alongside sdcard.img.
image logs.ext4 {
	ext4 {
		label = "logs"
	}

	empty = true
	temporary = true
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	# Not in the partition table: the BROM expects the SPL at a fixed
	# 8 KiB offset, which would otherwise overlap partition 1.
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 504K # 512K - 8K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 0
	}

	partition logs {
		partition-type = 0x83
		image = "logs.ext4"
	}

	# Emergency swap backstop. zram (priority 100) is the real swap; this is
	# priority 10 and should never be touched -- see S02swap.
	#
	# No `image =` on purpose: genimage has no swap handler, so the area ships
	# unformatted and S02swap runs mkswap on first boot. That is legal here --
	# genimage.c:830 allows an imageless partition when it is in the partition
	# table, image-hd.c:616 skips the data write but still emits the MBR entry,
	# and image-hd.c:1161 requires the explicit non-zero, 512-multiple `size`
	# below.
	#
	# CONSEQUENCE, do not be surprised by it: hdimage only extends file_size for
	# partitions that carry an image, and this block sets neither `fill` nor GPT
	# -- so sdcard.img ENDS at the end of p3 and the MBR declares p4 past EOF.
	# That is desirable (the image does not grow, flashing writes 64 MiB less,
	# dd and bmaptool do not care) but it means the CARD MUST BE >= ~648 MiB, and
	# some GUI flashers may warn. S02swap checks the partition really has 131072
	# sectors before touching it. Add `fill = true` to hdimage if you ever want
	# the image self-consistent instead.
	#
	# This takes the LAST free MBR primary slot; a fifth partition needs
	# extended/logical or a move to GPT.
	partition swap {
		partition-type = 0x82
		size = 64M
	}
}
