# SD-card image for the Lctech Pi F1C200s.
#   - offset 8 KiB : u-boot-sunxi-with-spl.bin (BROM loads SPL from here)
#   - partition 1  : FAT (zImage + dtb + boot menu files) -> /dev/mmcblk0p1
#   - partition 2  : ext4 root filesystem, an OSTree system -> /dev/mmcblk0p2
#   - partition 3  : ext4 logs            -> /dev/mmcblk0p3, mounted /var/log
#   - partition 4  : extended, holding the logical partitions:
#     - partition 5: swap, 64 MiB         -> /dev/mmcblk0p5 (S03swap)
#     - partition 6: LEHU OS's root, 4 GiB, left empty (lehu-os/scripts/install-p6.sh)
#     - partition 7: exFAT "LEHU-MAPS", the rest of the card, mounted /maps
# genimage writes p1-p3. post-image-sdcard.sh adds p4 and p5 at the sectors a
# card shared with LEHU OS has them (lehu-os/docs/dual-boot.md): genimage puts
# an extended partition one sector before its first logical one, where parted
# cannot grow it. S02maps adds p6 and p7 on the first boot of a card flashed
# with the image, which cannot know how big the card is.

image boot.vfat {
	vfat {
		files = {
			"zImage",
			"suniv-f1c200s-lctech-pi.dtb",
			"f1c-boot.scr",
			"f1c-settings.dtb"
		}
	}

	size = 8M
}

# Logs get their own filesystem so they are never written into the rootfs.
# This is a head unit: it loses power the moment the ignition goes off, and a
# write-heavy log is the single most likely thing to corrupt the filesystem it
# lives on. Confining that risk to a partition nothing boots from means a torn
# log costs a fsck of p3, not an unbootable board.
#
# empty     - no source directory; genimage's ext4 handler omits mke2fs -d.
# temporary - the intermediate logs.ext4 is not kept alongside sdcard.img.
image logs.ext4 {
	ext4 {
		label = "logs"
	}

	empty = true
	temporary = true
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	# Not in the partition table: the BROM expects the SPL at a fixed
	# 8 KiB offset, which would otherwise overlap partition 1.
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 504K # 512K - 8K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ostreefs"
		size = 0
	}

	partition logs {
		partition-type = 0x83
		image = "logs.ext4"
	}
}
