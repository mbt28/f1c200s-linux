# SoftAP config, started on EVERY BOOT by S44ap (wireless Android Auto and the
# wireless dev loop both join this AP). The ESP32 radio is 2.4 GHz-only,
# 802.11b/g/n. After editing: ap off; ap on. Uncomment country_code for your
# regulatory domain.
#
# THE PASSPHRASE BELOW IS PUBLIC -- it is committed to a public repository, so
# treat this AP as a network anyone in radio range can join. That is a
# deliberate trade for a development board: it makes a freshly flashed card
# reachable with no provisioning step. What keeps it defensible is that
# joining the AP grants NETWORK access, not the board:
#   - root's password is locked (BR2_TARGET_GENERIC_ROOT_PASSWD="*")
#   - dropbear runs with -s, refusing password auth outright
#   - so SSH requires a key from rootfs-overlay/root/.ssh/authorized_keys
# What it does NOT protect: whatever the app listens on over wlan0 (the
# CarPlay/AA projection ports) is reachable by any AP client.
# Before this ships as a product, move to a per-device generated passphrase
# and a per-device SSID.
interface=wlan0
driver=nl80211
ssid=f1c200s-ap
#country_code=DE
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=f1c200s-dev
# Gives hostapd_cli something to attach to (RELOAD, STATUS). Buildroot installs
# hostapd_cli unconditionally and it is useless without this. Convenience only:
# on this driver a stop/start is still the reliable way to apply a change.
ctrl_interface=/var/run/hostapd
