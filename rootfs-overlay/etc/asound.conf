# Software mixing for the single F1C200s audio codec (written for FastCarPlay
# in 2026-10, the image's default ALSA device since).
#
# The F1C codec has ONE playback stream and alsa-lib's default device has no
# mixer, so an app's music and voice streams fight for the device (FastCarPlay's
# main, type 102, and aux, type 100/101, did): one opened, the other got EBUSY,
# and the app worked around it by closing the device on every idle gap -- which
# reopened the codec on nearly every burst of a live call and chopped
# telephony/Siri.
#
# dmix mixes the two streams in software onto one hardware playback stream, so
# both can stay open at once (no EBUSY, no close/reopen churn). The mix rate is
# 48000, the cleanest common rate here: OPUS voice already decodes to 48k (no
# resample), PCM voice (16k/24k) upsamples to 48k by an exact integer factor
# (x3 / x2, cheap), and the media (AAC) is advertised as 48k too so music is not
# resampled either. 44100 would instead force fractional resampling on all of
# them.
#
# Capture (the mic uplink) is kept on a plain hw path via `asym`, since dmix is
# playback-only; the codec is full-duplex (Siri proved simultaneous TTS+mic).
#
# Deploy to /etc/asound.conf on the target.

pcm.!default {
    type asym
    playback.pcm "codec_dmix"
    capture.pcm "codec_cap"
}

pcm.codec_dmix {
    type dmix
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 4096
    }
}

pcm.codec_cap {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
