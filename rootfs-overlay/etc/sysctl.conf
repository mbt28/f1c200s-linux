# VM tuning for a 52 MiB single-core board running a realtime video path.
# Applied by /etc/init.d/S02swap via `sysctl -q -p` BEFORE any swap is enabled,
# so the very first reclaim already uses these watermarks.
#
# The governing constraint: there is ONE 408 MHz ARMv5 core, and fastcarplay
# runs SCHED_FIFO reader threads. Every zram page-in is a synchronous LZO
# decompress run BY THE FAULTING THREAD; every page-out under direct reclaim is
# a synchronous compress run by whoever is allocating. So the goal is not to
# maximise swap usage -- it is to keep swap a pressure valve that is almost
# never touched, and to keep reclaim off the video thread entirely.

# Standard zram advice is 100-180. That advice assumes compression runs on a
# different core than the workload, which is false here. 10 biases reclaim
# toward file-backed pages (ffmpeg/SDL/libc text -- clean, re-readable from the
# card at leisure) and only touches anon when file reclaim cannot keep up.
# NOT 0: on modern kernels that means "never swap anon until the OOM boundary",
# which converts graceful degradation into a cliff -- the opposite of the
# preventative headroom this is for. Revisit toward 20-30 only with a measured
# video soak showing no stutter.
vm.swappiness = 10

# Default 3 = read 8 pages per swap-in fault. For zram that is 8 decompressions
# to satisfy 1, in the fault path, on the only core. Highest-value latency knob
# here.
vm.page-cluster = 0

# The one that actually protects the RT thread. Higher watermarks make kswapd
# start reclaiming earlier IN ITS OWN KTHREAD, so allocations on the video path
# find free pages and never enter DIRECT reclaim -- which would run compression
# inline on the allocating thread. That is the stutter mechanism.
# Honest cost: ~4 MiB held free rather than used as page cache, which partly
# offsets what zram buys. Side benefit: higher watermarks also help cma_alloc
# succeed, and cma_alloc -12 is this board's only documented memory failure.
vm.min_free_kbytes = 4096

# Default 10 (0.1%). Widening low->high makes kswapd reclaim a batch and sleep
# instead of oscillating; fewer, longer kswapd runs beat many short ones on a
# single core sharing time with an RT thread.
# Check the resulting values with: grep -E 'min|low|high' /proc/zoneinfo
vm.watermark_scale_factor = 200
